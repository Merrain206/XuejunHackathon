[pytest]
# 全项目使用绝对导入（与 uvicorn 从 xray-backend/ 启动的写法一致），
# 因此必须把项目根加入 sys.path，否则 pytest 收集阶段就会 ImportError。
pythonpath = .

testpaths = tests
python_files = test_api_*.py

# ⚠️ basetemp 只能作为**命令行参数**传给 pytest（写进 ini 会被忽略并告警），
#    所以放在 addopts 里。
#
#    为什么必须指定、且要挑名字：
#      * 受限环境下系统临时目录（$TEMP）无法创建文件，pytest 的 tmp_path 默认
#        建在 $TEMP 下 → PermissionError；
#      * 且被 pytest 使用过的目录可能被沙箱打上受限 ACL（连 os.scandir 都拒绝），
#        而 pytest 结束时会对 basetemp 调 scandir 清理旧临时目录 → 报错。
#    因此用一个独立、且未被使用过的目录名（.pytest-run）。
addopts = -q --tb=short --basetemp=.pytest-run

filterwarnings =
    ignore::DeprecationWarning
    ignore::pytest.PytestCacheWarning
