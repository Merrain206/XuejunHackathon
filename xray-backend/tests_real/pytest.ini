[pytest]
# 真实库验收测试的独立配置。
#
# 为什么不能共用 xray-backend/pytest.ini：
#   * testpaths = tests 会把 tests_real 排除在外；
#   * addopts 里写死 --basetemp=.pytest-run，而该目录在受限沙箱下已被打上
#     受限 ACL（连 os.scandir 都拒绝），pytest 启动时 rm_rf 它会直接
#     PermissionError —— 于是整个目录一个测试都跑不起来。
pythonpath = ..

testpaths = .
python_files = test_api_*.py

# ⚠️ 受限沙箱会把本进程创建的目录打上受限 ACL，pytest 自己留下的
#    pytest-cache-files-* 目录随后无法 os.scandir。若不排除，收集阶段就会
#    PermissionError 中断。另外把 cache_dir 挪出本目录，不再产生这类残留。
norecursedirs = pytest-cache-files-* .pytest-run-real __pycache__
cache_dir = ../.pytest-cache-real

addopts = -q --tb=short --basetemp=../.pytest-run-real

filterwarnings =
    ignore::DeprecationWarning
    ignore::pytest.PytestCacheWarning
